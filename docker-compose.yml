version: '3.8'

services:
  # PostgreSQL база данных
  db:
    image: postgres:15-alpine
    container_name: forms_db
    restart: always
    environment:
      POSTGRES_DB: forms_db
      POSTGRES_USER: forms_user
      POSTGRES_PASSWORD: forms_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms_user -d forms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forms_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://forms_user:forms_secure_password_2026@db:5432/forms_db
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "80:3000"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
