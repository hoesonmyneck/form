version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: forms_postgres
    environment:
      POSTGRES_DB: forms_db
      POSTGRES_USER: forms_user
      POSTGRES_PASSWORD: forms_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - forms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms_user -d forms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forms_app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: forms_db
      DB_USER: forms_user
      DB_PASSWORD: forms_password_2024
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      ADMIN_USER: admin
      ADMIN_PASS: admin123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forms_network
    volumes:
      - ./server/uploads:/app/server/uploads
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  forms_network:
    driver: bridge
