<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Формы МТСЗН РК</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --secondary: #c9a227;
            --bg: #f0f4f8;
            --bg-paper: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success: #059669;
            --error: #dc2626;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PT Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #0f2440 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            font-family: inherit;
            font-size: 0.9rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.25);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Статистика */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-paper);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card .icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Таблица документов */
        .documents-section {
            background: var(--bg-paper);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .section-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-header h2 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filters {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .filter-select {
            font-family: inherit;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 180px;
        }

        .documents-table {
            width: 100%;
            border-collapse: collapse;
        }

        .documents-table th {
            background: var(--bg);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .documents-table td {
            padding: 1rem;
            border-top: 1px solid var(--border);
            vertical-align: middle;
        }

        .documents-table tr:hover td {
            background: #f8fafc;
        }

        .doc-name {
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .doc-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .form-badge.form-1 { background: #dbeafe; color: #1e40af; }
        .form-badge.form-2 { background: #dcfce7; color: #166534; }
        .form-badge.form-3 { background: #fef3c7; color: #92400e; }
        .form-badge.form-4 { background: #fce7f3; color: #9d174d; }
        .form-badge.form-all { background: #e5e7eb; color: #374151; }

        .action-btn {
            font-family: inherit;
            font-size: 0.85rem;
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s;
        }

        .btn-download {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-download:hover {
            background: #bfdbfe;
        }

        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Модальное окно подтверждения */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 1rem;
        }

        .modal-content p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn-cancel {
            background: var(--bg);
            color: var(--text);
        }

        .btn-confirm-delete {
            background: var(--error);
            color: white;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .page-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .page-btn:hover {
            background: var(--bg);
        }

        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .section-header {
                flex-direction: column;
            }

            .filters {
                flex-wrap: wrap;
                width: 100%;
            }

            .filter-select {
                width: 100%;
                min-width: auto;
            }

            .documents-table {
                font-size: 0.85rem;
            }

            .documents-table th,
            .documents-table td {
                padding: 0.75rem 0.5rem;
            }

            .action-btn {
                padding: 0.3rem 0.5rem;
                font-size: 0.8rem;
            }
        }

        /* Уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow);
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>🔐 Админ-панель</h1>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary">
                <span>📝</span> К формам
            </a>
            <button class="btn btn-secondary" onclick="loadDocuments()">
                <span>🔄</span> Обновить
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Управление пользователями -->
        <div class="section">
            <div class="section-header" style="cursor: pointer;" onclick="toggleUsersSection()">
                <h2>
                    <span id="usersToggleIcon" style="display: inline-block; transition: transform 0.3s; transform: rotate(-90deg);">▶</span>
                    👥 Управление пользователями
                </h2>
                <button class="btn btn-primary" onclick="event.stopPropagation(); showCreateUserModal()">
                    <span>➕</span> Создать пользователя
                </button>
            </div>
            <div id="usersTableContainer" style="display: none;"></div>
        </div>

        <!-- Статистика -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📄</div>
                <div class="value" id="statTotal">0</div>
                <div class="label">Всего документов</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="value" id="statForm1">0</div>
                <div class="label">Форма №1</div>
            </div>
            <div class="stat-card">
                <div class="icon">📋</div>
                <div class="value" id="statForm2">0</div>
                <div class="label">Форма №2</div>
            </div>
            <div class="stat-card">
                <div class="icon">📑</div>
                <div class="value" id="statForm3">0</div>
                <div class="label">Форма №3</div>
            </div>
            <div class="stat-card">
                <div class="icon">📃</div>
                <div class="value" id="statForm4">0</div>
                <div class="label">Форма №4</div>
            </div>
        </div>

        <!-- Таблица документов -->
        <div class="documents-section">
            <div class="section-header">
                <h2>📁 Загруженные документы</h2>
                <div class="filters">
                    <select class="filter-select" id="formFilter" onchange="filterDocuments()">
                        <option value="">Все формы</option>
                        <option value="1">Форма №1</option>
                        <option value="2">Форма №2</option>
                        <option value="3">Форма №3</option>
                        <option value="4">Форма №4</option>
                    </select>
                    <select class="filter-select" id="userFilter" onchange="filterDocuments()">
                        <option value="">Все пользователи</option>
                    </select>
                    <select class="filter-select" id="orgFilter" onchange="filterDocuments()">
                        <option value="">Все организации</option>
                    </select>
                </div>
            </div>

            <div id="documentsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Загрузка документов...
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно удаления -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>🗑️ Удалить документ?</h3>
            <p id="deleteDocName">Это действие нельзя отменить.</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">Отмена</button>
                <button class="btn btn-confirm-delete" onclick="confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания пользователя -->
    <div class="modal" id="createUserModal">
        <div class="modal-content" style="max-width: 500px; text-align: left;">
            <h3 style="text-align: center;">👤 Создать пользователя</h3>
            <form onsubmit="handleCreateUser(event)" style="margin-top: 1.5rem;">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Логин *</label>
                    <input type="text" id="newUserUsername" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Пароль *</label>
                    <input type="text" id="newUserPassword" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Организация</label>
                    <input type="text" id="newUserOrganization" value="МТСЗН РК" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeCreateUserModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="createUserBtn">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allDocuments = [];
        let deleteDocId = null;

        // Проверка авторизации и прав админа
        async function checkAdminAccess() {
            const token = localStorage.getItem('accessToken');
            
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }
            
            try {
                const response = await fetch('/api/user/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Unauthorized');
                }
                
                const data = await response.json();
                
                if (!data.success || !data.user) {
                    throw new Error('User data not found');
                }
                
                // Проверяем, что пользователь - админ
                if (data.user.role !== 'admin') {
                    alert('Доступ запрещен. Требуются права администратора.');
                    window.location.href = '/index.html';
                    return false;
                }
                
                return true;
                
            } catch (error) {
                console.error('Ошибка проверки доступа:', error);
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
                window.location.href = '/login.html';
                return false;
            }
        }

        // Загрузка данных при старте
        document.addEventListener('DOMContentLoaded', async () => {
            const hasAccess = await checkAdminAccess();
            if (hasAccess) {
                loadDocuments();
                loadStats();
                loadUsers();
            }
        });

        // ===============================================
        // УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ
        // ===============================================

        let allUsers = [];
        let usersVisible = false; // По умолчанию свёрнут

        // Переключение видимости списка пользователей
        function toggleUsersSection() {
            const container = document.getElementById('usersTableContainer');
            const icon = document.getElementById('usersToggleIcon');
            
            usersVisible = !usersVisible;
            
            if (usersVisible) {
                container.style.display = 'block';
                icon.style.transform = 'rotate(0deg)';
                icon.textContent = '▼';
            } else {
                container.style.display = 'none';
                icon.style.transform = 'rotate(-90deg)';
                icon.textContent = '▶';
            }
        }

        // Загрузка списка пользователей
        async function loadUsers() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/admin/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        // Токен недействителен - очищаем и редиректим
                        localStorage.removeItem('accessToken');
                        localStorage.removeItem('refreshToken');
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Ошибка загрузки');
                }
                
                const data = await response.json();
                
                if (data.success) {
                    allUsers = data.users;
                    renderUsers(allUsers);
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
                showToast('Ошибка загрузки пользователей', 'error');
            }
        }

        // Отображение списка пользователей
        function renderUsers(users) {
            const container = document.getElementById('usersTableContainer');
            
            if (users.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 2rem;">Нет пользователей</p>';
                return;
            }

            const tableHTML = `
                <table class="documents-table">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Логин</th>
                            <th>Email</th>
                            <th>Организация</th>
                            <th>Роль</th>
                            <th>Дата создания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${users.map(user => `
                            <tr>
                                <td><strong>${escapeHtml(user.fullName)}</strong></td>
                                <td>${escapeHtml(user.username)}</td>
                                <td>${escapeHtml(user.email)}</td>
                                <td>${escapeHtml(user.organization || 'Не указано')}</td>
                                <td>
                                    <span style="padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; ${user.role === 'admin' ? 'background: #fee; color: #c33;' : 'background: #efe; color: #3c3;'}">
                                        ${user.role === 'admin' ? '👑 Админ' : '👤 Пользователь'}
                                    </span>
                                </td>
                                <td>
                                    <div>${formatDate(user.createdAt)}</div>
                                    <div class="doc-meta">${formatTime(user.createdAt)}</div>
                                </td>
                                <td>
                                    ${user.role !== 'admin' ? `
                                        <button class="action-btn btn-delete" onclick="deleteUser('${user.id}', '${escapeHtml(user.fullName)}')">
                                            🗑️
                                        </button>
                                    ` : '<span style="color: var(--text-muted);">—</span>'}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        // Показать модальное окно создания пользователя
        function showCreateUserModal() {
            document.getElementById('createUserModal').classList.add('active');
            // Очистить форму
            document.getElementById('newUserUsername').value = '';
            document.getElementById('newUserPassword').value = '';
            document.getElementById('newUserOrganization').value = 'МТСЗН РК';
        }

        // Закрыть модальное окно создания
        function closeCreateUserModal() {
            document.getElementById('createUserModal').classList.remove('active');
        }

        // Создание пользователя
        async function handleCreateUser(event) {
            event.preventDefault();
            
            const username = document.getElementById('newUserUsername').value;
            const password = document.getElementById('newUserPassword').value;
            const organization = document.getElementById('newUserOrganization').value;
            
            const btn = document.getElementById('createUserBtn');
            btn.disabled = true;
            btn.textContent = 'Создание...';
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email: username, // Используем username как email
                        password,
                        fullName: username, // Используем username как fullName
                        organization,
                        role: 'user'
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка создания пользователя');
                }

                showToast('Пользователь создан', 'success');
                closeCreateUserModal();
                loadUsers();

            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Создать';
            }
        }

        // Удаление пользователя
        async function deleteUser(userId, userName) {
            if (!confirm(`Удалить пользователя "${userName}"?`)) {
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка удаления');
                }

                showToast('Пользователь удалён', 'success');
                loadUsers();

            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        // ===============================================
        // УПРАВЛЕНИЕ ДОКУМЕНТАМИ
        // ===============================================

        // Загрузка списка документов
        async function loadDocuments() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/documents', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        // Токен недействителен - очищаем и редиректим
                        localStorage.removeItem('accessToken');
                        localStorage.removeItem('refreshToken');
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Ошибка загрузки');
                }
                
                const data = await response.json();
                
                if (data.success) {
                    allDocuments = data.documents;
                    renderDocuments(allDocuments);
                    updateUsersList(); // Обновляем список пользователей
                    updateOrganizationsList(); // Обновляем список организаций
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showToast('Ошибка загрузки документов', 'error');
            }
        }

        // Загрузка статистики
        async function loadStats() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/stats', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('statTotal').textContent = data.stats.total;
                    document.getElementById('statForm1').textContent = data.stats.byForm.form1;
                    document.getElementById('statForm2').textContent = data.stats.byForm.form2;
                    document.getElementById('statForm3').textContent = data.stats.byForm.form3;
                    document.getElementById('statForm4').textContent = data.stats.byForm.form4;
                }
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        // Отрисовка документов
        function renderDocuments(documents) {
            const container = document.getElementById('documentsContainer');
            
            if (documents.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Документы не найдены</h3>
                        <p>Загруженные документы появятся здесь</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <table class="documents-table">
                    <thead>
                        <tr>
                            <th>Документ</th>
                            <th>Форма</th>
                            <th>Пользователь</th>
                            <th>Организация</th>
                            <th>Дата загрузки</th>
                            <th>Размер</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${documents.map(doc => `
                            <tr>
                                <td>
                                    <div class="doc-name">📄 ${escapeHtml(doc.originalName)}</div>
                                </td>
                                <td>
                                    <span class="form-badge form-${doc.formNumber}">
                                        ${getFormLabel(doc.formNumber)}
                                    </span>
                                </td>
                                <td>
                                    <div><strong>${escapeHtml(doc.userFullName || doc.username || 'Неизвестно')}</strong></div>
                                    <div class="doc-meta">${escapeHtml(doc.userEmail || '')}</div>
                                </td>
                                <td>${escapeHtml(doc.organization)}</td>
                                <td>
                                    <div>${formatDate(doc.uploadedAt)}</div>
                                    <div class="doc-meta">${formatTime(doc.uploadedAt)}</div>
                                </td>
                                <td>${formatSize(doc.size)}</td>
                                <td>
                                    <button class="action-btn btn-download" onclick="downloadDoc('${doc.id}')">
                                        ⬇️ Скачать
                                    </button>
                                    <button class="action-btn btn-delete" onclick="showDeleteModal('${doc.id}', '${escapeHtml(doc.originalName)}')">
                                        🗑️
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
        }

        // Фильтрация документов
        function filterDocuments() {
            const formFilter = document.getElementById('formFilter').value;
            const userFilter = document.getElementById('userFilter').value;
            const orgFilter = document.getElementById('orgFilter').value;

            let filtered = allDocuments;

            // Фильтр по форме
            if (formFilter) {
                filtered = filtered.filter(doc => doc.formNumber === formFilter);
            }

            // Фильтр по пользователю
            if (userFilter) {
                filtered = filtered.filter(doc => doc.userId === userFilter);
            }

            // Фильтр по организации
            if (orgFilter) {
                filtered = filtered.filter(doc => doc.organization === orgFilter);
            }

            renderDocuments(filtered);
        }
        
        // Обновление списка пользователей для select
        function updateUsersList() {
            // Собираем уникальных пользователей
            const usersMap = new Map();
            allDocuments.forEach(doc => {
                if (doc.userId && doc.userFullName) {
                    usersMap.set(doc.userId, doc.userFullName);
                }
            });
            
            // Сортируем по имени
            const users = Array.from(usersMap.entries()).sort((a, b) => a[1].localeCompare(b[1]));
            
            const select = document.getElementById('userFilter');
            
            // Сохраняем текущее значение
            const currentValue = select.value;
            
            // Очищаем и добавляем "Все пользователи"
            select.innerHTML = '<option value="">Все пользователи</option>';
            
            // Добавляем пользователей
            users.forEach(([userId, userName]) => {
                const option = document.createElement('option');
                option.value = userId;
                option.textContent = userName;
                select.appendChild(option);
            });
            
            // Восстанавливаем значение если оно существует
            if (currentValue && usersMap.has(currentValue)) {
                select.value = currentValue;
            }
        }
        
        // Обновление списка организаций для select
        function updateOrganizationsList() {
            const organizations = [...new Set(allDocuments.map(doc => doc.organization))].filter(org => org).sort();
            const select = document.getElementById('orgFilter');
            
            // Сохраняем текущее значение
            const currentValue = select.value;
            
            // Очищаем и добавляем "Все организации"
            select.innerHTML = '<option value="">Все организации</option>';
            
            // Добавляем организации
            organizations.forEach(org => {
                const option = document.createElement('option');
                option.value = org;
                option.textContent = org;
                select.appendChild(option);
            });
            
            // Восстанавливаем значение если оно существует
            if (currentValue && organizations.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        // Скачивание документа
        async function downloadDoc(id) {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/documents/${id}/download`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Ошибка скачивания');
                }

                // Получаем имя файла из заголовков
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'document.docx';
                if (contentDisposition) {
                    const filenameMatch = contentDisposition.match(/filename\*?=['"]?(?:UTF-\d['"]*)?([^;\r\n"']*)['"]?;?/);
                    if (filenameMatch && filenameMatch[1]) {
                        filename = decodeURIComponent(filenameMatch[1]);
                    }
                }

                // Скачиваем файл
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (error) {
                showToast('Ошибка скачивания файла', 'error');
            }
        }

        // Показать модальное окно удаления
        function showDeleteModal(id, name) {
            deleteDocId = id;
            document.getElementById('deleteDocName').textContent = `Вы уверены, что хотите удалить "${name}"?`;
            document.getElementById('deleteModal').classList.add('active');
        }

        // Закрыть модальное окно
        function closeDeleteModal() {
            deleteDocId = null;
            document.getElementById('deleteModal').classList.remove('active');
        }

        // Подтвердить удаление
        async function confirmDelete() {
            if (!deleteDocId) return;

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/documents/${deleteDocId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Документ удалён', 'success');
                    loadDocuments();
                    loadStats();
                } else {
                    showToast(data.error || 'Ошибка удаления', 'error');
                }
            } catch (error) {
                showToast('Ошибка при удалении', 'error');
            }

            closeDeleteModal();
        }

        // Вспомогательные функции
        function getFormLabel(formNumber) {
            const labels = {
                '1': 'Форма №1',
                '2': 'Форма №2',
                '3': 'Форма №3',
                '4': 'Форма №4',
                'all': 'Все формы'
            };
            return labels[formNumber] || formNumber;
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleDateString('ru-RU');
        }

        function formatTime(isoString) {
            return new Date(isoString).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function formatSize(bytes) {
            if (!bytes) return '—';
            const kb = bytes / 1024;
            if (kb < 1024) return kb.toFixed(1) + ' КБ';
            return (kb / 1024).toFixed(1) + ' МБ';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Закрытие модалок по клику вне их
        document.getElementById('deleteModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') closeDeleteModal();
        });
        
        document.getElementById('createUserModal').addEventListener('click', (e) => {
            if (e.target.id === 'createUserModal') closeCreateUserModal();
        });
    </script>
