<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Формы МТСЗН РК</title>
    <script src="docx.umd.js"></script>
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --primary-dark: #0f2440;
            --accent: #2563eb;
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --bg: #f0f4f8;
            --bg-paper: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-dark: #94a3b8;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --font-sans: 'PT Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'PT Serif', Georgia, 'Times New Roman', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Вкладки форм */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .tab:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-paper);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .filter-select {
            font-family: inherit;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 180px;
        }

        /* Таблицы с данными форм */
        .form-table-container {
            background: var(--bg-paper);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .form-table th {
            background: var(--primary);
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--primary-dark);
            white-space: nowrap;
        }

        .form-table td {
            padding: 0.75rem;
            border: 1px solid var(--border);
            vertical-align: top;
        }

        .form-table tr:nth-child(even) {
            background: #f8fafc;
        }

        .form-table tr:hover {
            background: #e0f2fe;
        }

        .file-link {
            color: var(--accent);
            text-decoration: none;
            display: inline-block;
            margin: 0.25rem 0;
            cursor: pointer;
        }

        .file-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        /* Toast уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>👤 Личный кабинет - Формы МТСЗН РК</h1>
            <div class="header-actions">
                <a href="/index.html" class="btn btn-secondary">
                    <span>📝</span> К формам
                </a>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <span>🔄</span> Обновить
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Фильтры -->
        <div class="filters">
            <select class="filter-select" id="userFilter" onchange="filterForms()">
                <option value="">Все пользователи</option>
            </select>
            <select class="filter-select" id="orgFilter" onchange="filterForms()">
                <option value="">Все организации</option>
            </select>
            <select class="filter-select" id="typeFilter" onchange="filterForms()">
                <option value="">Все типы</option>
                <option value="soc">Соц. защита</option>
                <option value="trud">Инспекция труда</option>
            </select>
            <button class="btn btn-primary" onclick="downloadFilteredData()" style="margin-left: auto;">
                <span>📥</span> Скачать текущую форму
            </button>
        </div>

        <!-- Вкладки форм -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(1)">Форма № 1</button>
            <button class="tab" onclick="switchTab(2)">Форма № 2</button>
            <button class="tab" onclick="switchTab(3)">Форма № 3</button>
            <button class="tab" onclick="switchTab(4)">Форма № 4</button>
        </div>

        <!-- Контейнеры для каждой формы -->
        <div id="form1Container" class="form-container"></div>
        <div id="form2Container" class="form-container hidden"></div>
        <div id="form3Container" class="form-container hidden"></div>
        <div id="form4Container" class="form-container hidden"></div>
    </div>

    <script>
        let currentTab = 1;
        let allForms = [];

        // Инициализация
        document.addEventListener('DOMContentLoaded', async () => {
            const hasAccess = await checkUserAccess();
            if (hasAccess) {
                await loadAllForms();
                updateFilters();
                renderCurrentForm();
            }
        });

        // Проверка доступа (НЕ админ)
        async function checkUserAccess() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }

            try {
                const response = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Unauthorized');

                const data = await response.json();
                if (!data.success || !data.user) throw new Error('User data not found');

                // Если пользователь админ - редирект в админку
                if (data.user.role === 'admin') {
                    window.location.href = '/admin';
                    return false;
                }

                // Если plans-пользователь случайно зашёл в кабинет index1
                if (data.user.formType === 'plans' || data.user.username === 'admin2') {
                    window.location.href = '/admin2';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Ошибка проверки доступа:', error);
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
                window.location.href = '/login.html';
                return false;
            }
        }

        // Загрузка всех форм
        async function loadAllForms() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/documents', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                console.log('📥 Загружено документов:', data);
                
                if (data.success) {
                    // Фильтруем только JSON формы
                    allForms = data.documents.filter(doc => doc.type === 'json');
                    console.log('📊 JSON форм:', allForms.length, allForms);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки форм:', error);
            }
        }

        // Переключение вкладок
        function switchTab(formNumber) {
            currentTab = formNumber;

            // Обновляем активную вкладку
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index + 1 === formNumber);
            });

            // Показываем нужный контейнер
            for (let i = 1; i <= 4; i++) {
                const container = document.getElementById(`form${i}Container`);
                container.classList.toggle('hidden', i !== formNumber);
            }

            renderCurrentForm();
        }

        // Рендеринг текущей формы
        function renderCurrentForm() {
            const container = document.getElementById(`form${currentTab}Container`);
            
            // Фильтруем формы
            let forms = allForms.filter(f => f.formNumber == currentTab);
            console.log(`📋 Форма ${currentTab}: найдено ${forms.length} записей`);
            
            forms = applyFilters(forms);
            console.log(`🔍 После фильтров: ${forms.length} записей`);

            if (forms.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных для отображения</div>';
                return;
            }

            // Рендерим таблицу с данными
            container.innerHTML = renderFormTable(forms);
        }

        // Рендеринг таблицы формы
        function renderFormTable(forms) {
            if (forms.length === 0) return '';

            // Собираем все строки из всех форм в одну большую таблицу
            let allRows = [];
            
            forms.forEach(form => {
                const formData = form.formData;
                
                // Информация о пользователе для каждой строки
                const userInfo = {
                    fullName: form.userFullName || form.username,
                    organization: form.userOrganization || form.organization,
                    savedAt: new Date(form.uploadedAt).toLocaleString('ru-RU')
                };
                
                // Собираем все строки из всех таблиц этой формы
                if (formData.tables && Object.keys(formData.tables).length > 0) {
                    for (const tableId in formData.tables) {
                        const tableData = formData.tables[tableId];
                        
                        // Поддержка нового формата (с rows + rowIds) и старого (просто массив)
                        const rows   = tableData.rows   || tableData;
                        const rowIds = tableData.rowIds || [];
                        
                        rows.forEach((row, rowIndex) => {
                            allRows.push({
                                user: userInfo,
                                tableId: tableId,
                                rowId: rowIds[rowIndex] || '',
                                cells: row,
                                attachedFiles: form.attachedFiles || {}
                            });
                        });
                    }
                }
            });

            if (allRows.length === 0) {
                return '<div class="empty-state">Нет данных для отображения</div>';
            }

            // Стандартные заголовки для каждой формы
            const defaultHeaders = {
                1: ['№', 'Истец', 'Ответчик', 'Суть спора (предмет, сумма иска и другие)', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                2: ['№', 'Истец', 'Ответчик', 'Суть спора (предмет, сумма иска и другие)', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                3: ['Раздел', 'Предмет спора', 'Количество за квартал', 'Согласовано*', 'Отказано*', 'На рассмотрении*', 'Примечание'],
                4: ['№', 'Вид акта и наименование органа', 'Вид нарушения', 'Принятые меры по устранению', 'Обжалование актов', 'Примечание']
            };

            const sectionNames = {
                'form3-appeal':     'Апелляционная инстанция',
                'form3-cassation':  'Кассационная инстанция',
                'form3-supervision':'Надзорная инстанция'
            };
            
            let headers = defaultHeaders[currentTab] || [];
            
            if (headers.length === 0 && allRows.length > 0) {
                const maxCols = Math.max(...allRows.map(r => r.cells.length));
                headers = ['№'];
                for (let i = 1; i < maxCols; i++) {
                    headers.push(`Колонка ${i}`);
                }
            }

            let html = '<div class="form-table-container">';
            html += '<table class="form-table">';
            
            // Заголовки
            html += '<thead><tr>';
            headers.forEach((header, index) => {
                if (index === 0) {
                    html += `<th style="width: 50px; text-align: center;">${escapeHtml(header)}</th>`;
                } else {
                    html += `<th>${escapeHtml(header)}</th>`;
                }
            });
            html += '<th style="width: 150px;">Файлы</th>';
            html += '</tr></thead>';
            
            // Данные
            html += '<tbody>';
            allRows.forEach((row, index) => {
                html += '<tr>';
                
                if (currentTab === 3) {
                    // Форма 3: первая колонка — название раздела, затем все ячейки данных
                    const sectionLabel = sectionNames[row.tableId] || row.tableId;
                    html += `<td style="font-weight:600; background:#eef2f7; white-space:nowrap;">${escapeHtml(sectionLabel)}</td>`;
                    row.cells.forEach(cell => {
                        html += `<td>${escapeHtml(cell || '')}</td>`;
                    });
                } else {
                    // Формы 1, 2, 4: первая колонка — сквозной номер
                    row.cells.forEach((cell, cellIndex) => {
                        if (cellIndex === 0) {
                            html += `<td style="font-weight:600; background:#f8fafc; text-align:center;">${index + 1}</td>`;
                        } else {
                            html += `<td>${escapeHtml(cell || '')}</td>`;
                        }
                    });
                }
                
                // Колонка с файлами
                const allFilesForForm = row.attachedFiles || {};
                // Новый формат: ключ = tableId__rowId; старый формат: ключ = tableId
                const rowKey = row.rowId ? (row.tableId + '__' + row.rowId) : null;
                const filesForThisSection = (rowKey && allFilesForForm[rowKey])
                    ? allFilesForForm[rowKey]
                    : (allFilesForForm[row.tableId] || []);
                
                if (filesForThisSection.length > 0) {
                    html += '<td>';
                    filesForThisSection.forEach(file => {
                        const safeFilename = file.filename.replace(/"/g, '&quot;');
                        const safeOriginal = file.originalName.replace(/"/g, '&quot;');
                        html += `<a href="javascript:void(0)" class="file-link" data-filename="${safeFilename}" data-original="${safeOriginal}" title="${escapeHtml(file.originalName)}">📎 ${escapeHtml(file.originalName)}</a><br>`;
                    });
                    html += '</td>';
                } else {
                    html += '<td style="text-align: center; color: #94a3b8;">—</td>';
                }
                
                html += '</tr>';
            });
            html += '</tbody>';
            
            html += '</table>';
            html += '</div>';
            
            return html;
        }

        // Применение фильтров
        function applyFilters(forms) {
            const userFilter = document.getElementById('userFilter').value;
            const orgFilter = document.getElementById('orgFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            if (userFilter) {
                forms = forms.filter(f => f.userId === userFilter);
            }

            if (orgFilter) {
                forms = forms.filter(f => {
                    const org = f.userOrganization || f.organization;
                    return org === orgFilter;
                });
            }

            if (typeFilter) {
                forms = forms.filter(f => {
                    const username = (f.username || '').toLowerCase();
                    if (typeFilter === 'soc') return username.endsWith('_soc');
                    if (typeFilter === 'trud') return username.endsWith('_trud');
                    return true;
                });
            }

            return forms;
        }

        // Обновление списков фильтров
        function updateFilters() {
            console.log('🔄 Обновление фильтров, всего форм:', allForms.length);
            
            const userFilter = document.getElementById('userFilter');
            const usersMap = new Map();
            allForms.forEach(f => {
                if (f.userId && !usersMap.has(f.userId)) {
                    usersMap.set(f.userId, f.userFullName || f.username);
                }
            });
            
            userFilter.innerHTML = '<option value="">Все пользователи</option>';
            usersMap.forEach((name, id) => {
                userFilter.innerHTML += `<option value="${id}">${escapeHtml(name)}</option>`;
            });
            console.log('👤 Пользователей в фильтре:', usersMap.size);

            const orgFilter = document.getElementById('orgFilter');
            const orgsSet = new Set(allForms.map(f => f.userOrganization || f.organization).filter(o => o));
            
            orgFilter.innerHTML = '<option value="">Все организации</option>';
            orgsSet.forEach(org => {
                orgFilter.innerHTML += `<option value="${escapeHtml(org)}">${escapeHtml(org)}</option>`;
            });
            console.log('🏢 Организаций в фильтре:', orgsSet.size);
        }

        // Фильтрация
        function filterForms() {
            renderCurrentForm();
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Скачивание файла с авторизацией
        async function downloadFile(filename, originalName) {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/files/${filename}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Файл не найден');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = originalName || filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                console.error('❌ Ошибка скачивания:', error);
                showToast('Ошибка скачивания файла', 'error');
            }
        }

        // Делегирование клика на ссылки файлов
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('file-link') || e.target.closest('.file-link')) {
                const link = e.target.classList.contains('file-link') ? e.target : e.target.closest('.file-link');
                const filename = link.dataset.filename;
                const originalName = link.dataset.original;
                
                if (filename && originalName) {
                    downloadFile(filename, originalName);
                }
            }
        });

        // Удаляет символы, недопустимые в XML (ломают DOCX)
        function sanitizeXml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F\uFFFE\uFFFF]/g, '')
                .replace(/[\uD800-\uDFFF]/g, '');
        }

        // Скачивание отфильтрованных данных как DOCX
        async function downloadFilteredData() {
            // Получаем текущие отфильтрованные формы
            let forms = allForms.filter(f => f.formNumber == currentTab);
            forms = applyFilters(forms);
            
            if (forms.length === 0) {
                showToast('Нет данных для скачивания', 'error');
                return;
            }

            // Собираем все строки
            let allRows = [];
            forms.forEach(form => {
                const formData = form.formData;
                if (formData.tables && Object.keys(formData.tables).length > 0) {
                    for (const tableId in formData.tables) {
                        const tableData = formData.tables[tableId];
                        const rows = tableData.rows || tableData;
                        rows.forEach(row => {
                            allRows.push({
                                user: form.userFullName || form.username,
                                organization: form.userOrganization || form.organization,
                                cells: row
                            });
                        });
                    }
                }
            });

            if (allRows.length === 0) {
                showToast('Нет данных для скачивания', 'error');
                return;
            }

            // Заголовки для каждой формы
            const defaultHeaders = {
                1: ['№', 'Истец', 'Ответчик', 'Суть спора', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                2: ['№', 'Истец', 'Ответчик', 'Суть спора', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                3: ['Раздел', 'Предмет спора', 'Количество за квартал', 'Согласовано*', 'Отказано*', 'На рассмотрении*', 'Примечание'],
                4: ['№', 'Вид акта', 'Вид нарушения', 'Принятые меры', 'Обжалование', 'Примечание']
            };
            
            const headers = defaultHeaders[currentTab] || [];
            const formNames = {
                1: 'Гражданские_дела',
                2: 'Административные_дела', 
                3: 'Запросы_на_согласование',
                4: 'Акты_судебных_органов'
            };

            try {
                const docxLib = window.docx || (typeof docx !== 'undefined' ? docx : null);
                if (!docxLib) throw new Error('Библиотека docx.umd.js не загружена. Убедитесь что файл docx.umd.js находится в папке проекта.');
                const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType, BorderStyle } = docxLib;

                // Создаём строки таблицы
                const tableRows = [];
                
                // Заголовок
                tableRows.push(new TableRow({
                    children: headers.map(header => new TableCell({
                        children: [new Paragraph({
                            children: [new TextRun({ text: header, bold: true, size: 20 })],
                            alignment: AlignmentType.CENTER
                        })],
                        shading: { fill: "1a365d" },
                    })),
                    tableHeader: true
                }));

                // Данные
                const docxSectionNames = {
                    'form3-appeal':     'Апелляционная инстанция',
                    'form3-cassation':  'Кассационная инстанция',
                    'form3-supervision':'Надзорная инстанция'
                };
                allRows.forEach((row, index) => {
                    let cells;
                    if (currentTab === 3) {
                        const sectionName = docxSectionNames[row.tableId] || row.tableId;
                        cells = [
                            new TableCell({
                                children: [new Paragraph({ children: [new TextRun({ text: sanitizeXml(sectionName), bold: true, size: 18 })] })]
                            }),
                            ...row.cells.map(cell => new TableCell({
                                children: [new Paragraph({ children: [new TextRun({ text: sanitizeXml(cell), size: 18 })] })]
                            }))
                        ];
                    } else {
                        cells = row.cells.map((cell, cellIndex) => new TableCell({
                            children: [new Paragraph({
                                children: [new TextRun({ 
                                    text: cellIndex === 0 ? String(index + 1) : sanitizeXml(cell), 
                                    size: 20 
                                })],
                                alignment: cellIndex === 0 ? AlignmentType.CENTER : AlignmentType.LEFT
                            })]
                        }));
                    }
                    tableRows.push(new TableRow({ children: cells }));
                });

                // Создаём документ
                const doc = new Document({
                    sections: [{
                        properties: {
                            page: { 
                                margin: { top: 720, right: 720, bottom: 720, left: 720 },
                                size: { orientation: "landscape" }
                            }
                        },
                        children: [
                            new Paragraph({
                                children: [new TextRun({ text: `Форма № ${currentTab} - Сводный отчет`, bold: true, size: 28 })],
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 200 }
                            }),
                            new Paragraph({
                                children: [new TextRun({ text: `Всего записей: ${allRows.length}`, size: 22 })],
                                spacing: { after: 200 }
                            }),
                            new Table({
                                rows: tableRows,
                                width: { size: 100, type: WidthType.PERCENTAGE }
                            })
                        ]
                    }]
                });

                // Генерируем файл
                const blob = await Packer.toBlob(doc);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const date = new Date().toISOString().slice(0, 10);
                a.download = `Форма_${currentTab}_${formNames[currentTab]}_${date}.docx`;
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showToast(`Скачано ${allRows.length} записей`, 'success');
            } catch (error) {
                console.error('❌ Ошибка генерации DOCX:', error);
                showToast('Ошибка генерации документа', 'error');
            }
        }
    </script>
</body>
</html>
