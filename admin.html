<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Формы МТСЗН РК</title>
    <script src="docx.umd.js"></script>
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2c5282;
            --primary-dark: #0f2440;
            --accent: #2563eb;
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --bg: #f0f4f8;
            --bg-paper: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-dark: #94a3b8;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --font-sans: 'PT Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'PT Serif', Georgia, 'Times New Roman', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Вкладки форм */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .tab:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-paper);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .filter-select {
            font-family: inherit;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            min-width: 180px;
        }

        /* Секция управления пользователями */
        .section {
            background: var(--bg-paper);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-header h2 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Таблицы с данными форм */
        .form-table-container {
            background: var(--bg-paper);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        .form-table th {
            background: var(--primary);
            color: white;
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--primary-dark);
            white-space: nowrap;
        }

        .form-table td {
            padding: 0.75rem;
            border: 1px solid var(--border);
            vertical-align: top;
        }

        .form-table tr:nth-child(even) {
            background: #f8fafc;
        }

        .form-table tr:hover {
            background: #e0f2fe;
        }

        .user-label {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .org-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-cancel:hover {
            background: #cbd5e1;
        }

        /* Toast уведомления */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            animation: slideUp 0.3s ease;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Управление пользователями */
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            background: var(--bg);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .users-table td {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-delete {
            background: #fee;
            color: #c33;
        }

        .btn-delete:hover {
            background: #fcc;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>🔐 Админ-панель - Формы МТСЗН РК</h1>
            <div class="header-actions">
                <a href="/index.html" class="btn btn-secondary">
                    <span>📝</span> К формам
                </a>
                <button class="btn btn-secondary" onclick="location.reload()">
                    <span>🔄</span> Обновить
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Управление пользователями (свернуто по умолчанию) -->
        <div class="section">
            <div class="section-header" style="cursor: pointer;" onclick="toggleUsersSection()">
                <h2>
                    <span id="usersToggleIcon" style="display: inline-block; transition: transform 0.3s; transform: rotate(-90deg);">▶</span>
                    👥 Управление пользователями
                </h2>
                <button class="btn btn-primary" onclick="event.stopPropagation(); showCreateUserModal()">
                    <span>➕</span> Создать пользователя
                </button>
            </div>
            <div id="usersTableContainer" style="display: none;"></div>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <select class="filter-select" id="userFilter" onchange="filterForms()">
                <option value="">Все пользователи</option>
            </select>
            <select class="filter-select" id="orgFilter" onchange="filterForms()">
                <option value="">Все организации</option>
            </select>
            <button class="btn btn-primary" onclick="downloadFilteredData()" style="margin-left: auto;">
                <span>📥</span> Скачать текущую форму
            </button>
        </div>

        <!-- Вкладки форм -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(1)">Форма № 1</button>
            <button class="tab" onclick="switchTab(2)">Форма № 2</button>
            <button class="tab" onclick="switchTab(3)">Форма № 3</button>
            <button class="tab" onclick="switchTab(4)">Форма № 4</button>
        </div>

        <!-- Контейнеры для каждой формы -->
        <div id="form1Container" class="form-container"></div>
        <div id="form2Container" class="form-container hidden"></div>
        <div id="form3Container" class="form-container hidden"></div>
        <div id="form4Container" class="form-container hidden"></div>
    </div>

    <!-- Модальное окно создания пользователя -->
    <div class="modal" id="createUserModal">
        <div class="modal-content">
            <h3 style="text-align: center; margin-bottom: 1.5rem;">👤 Создать пользователя</h3>
            <form onsubmit="handleCreateUser(event)">
                <div class="form-group">
                    <label>Логин *</label>
                    <input type="text" id="newUserUsername" required>
                </div>
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="text" id="newUserPassword" required>
                </div>
                <div class="form-group">
                    <label>Организация</label>
                    <input type="text" id="newUserOrganization" value="МТСЗН РК">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeCreateUserModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="createUserBtn">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTab = 1;
        let allForms = [];
        let allUsers = [];
        let usersVisible = false;

        // Инициализация
        document.addEventListener('DOMContentLoaded', async () => {
            const hasAccess = await checkAdminAccess();
            if (hasAccess) {
                await loadUsers();
                await loadAllForms();
                updateFilters();
                renderCurrentForm();
            }
        });

        // Проверка прав админа
        async function checkAdminAccess() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login.html';
                return false;
            }

            try {
                const response = await fetch('/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Unauthorized');

                const data = await response.json();
                if (!data.success || !data.user) throw new Error('User data not found');

                if (data.user.role !== 'admin') {
                    alert('Доступ запрещен. Требуются права администратора.');
                    window.location.href = '/index.html';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Ошибка проверки доступа:', error);
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
                window.location.href = '/login.html';
                return false;
            }
        }

        // Загрузка всех форм
        async function loadAllForms() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/documents', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                console.log('📥 Загружено документов:', data);
                
                if (data.success) {
                    // Фильтруем только JSON формы
                    allForms = data.documents.filter(doc => doc.type === 'json');
                    console.log('📊 JSON форм:', allForms.length, allForms);
                }
            } catch (error) {
                console.error('❌ Ошибка загрузки форм:', error);
            }
        }

        // Загрузка пользователей
        async function loadUsers() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success) {
                    allUsers = data.users;
                    renderUsers(allUsers);
                }
            } catch (error) {
                console.error('Ошибка загрузки пользователей:', error);
            }
        }

        // Переключение вкладок
        function switchTab(formNumber) {
            currentTab = formNumber;

            // Обновляем активную вкладку
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index + 1 === formNumber);
            });

            // Показываем нужный контейнер
            for (let i = 1; i <= 4; i++) {
                const container = document.getElementById(`form${i}Container`);
                container.classList.toggle('hidden', i !== formNumber);
            }

            renderCurrentForm();
        }

        // Рендеринг текущей формы
        function renderCurrentForm() {
            const container = document.getElementById(`form${currentTab}Container`);
            
            // Фильтруем формы
            let forms = allForms.filter(f => f.formNumber == currentTab);
            console.log(`📋 Форма ${currentTab}: найдено ${forms.length} записей`);
            
            forms = applyFilters(forms);
            console.log(`🔍 После фильтров: ${forms.length} записей`);

            if (forms.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет данных для отображения</div>';
                return;
            }

            // Рендерим таблицу с данными
            container.innerHTML = renderFormTable(forms);
        }

        // Рендеринг таблицы формы
        function renderFormTable(forms) {
            if (forms.length === 0) return '';

            // Собираем все строки из всех форм в одну большую таблицу
            let allRows = [];
            
            forms.forEach(form => {
                const formData = form.formData;
                
                // Информация о пользователе для каждой строки
                const userInfo = {
                    fullName: form.userFullName || form.username,
                    organization: form.userOrganization || form.organization,
                    savedAt: new Date(form.uploadedAt).toLocaleString('ru-RU')
                };
                
                // Собираем все строки из всех таблиц этой формы
                if (formData.tables && Object.keys(formData.tables).length > 0) {
                    for (const tableId in formData.tables) {
                        const tableData = formData.tables[tableId];
                        
                        // Поддержка нового формата (с headers и rows) и старого (просто массив)
                        const rows = tableData.rows || tableData;
                        
                        rows.forEach(row => {
                            allRows.push({
                                user: userInfo,
                                tableId: tableId,
                                cells: row,
                                attachedFiles: form.attachedFiles || {} // Добавляем файлы
                            });
                        });
                    }
                }
            });

            if (allRows.length === 0) {
                return '<div class="empty-state">Нет данных для отображения</div>';
            }

            // Стандартные заголовки для каждой формы (ВСЕГДА используем их)
            // Заголовки соответствуют ВСЕМ колонкам таблицы (включая статичные ячейки)
            const defaultHeaders = {
                // Форма 1 и 2: 8 колонок
                1: ['№', 'Истец', 'Ответчик', 'Суть спора (предмет, сумма иска и другие)', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                2: ['№', 'Истец', 'Ответчик', 'Суть спора (предмет, сумма иска и другие)', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                // Форма 3: 9 колонок (включая Предмет спора)
                3: ['Предмет спора', 'Количество квартал/год', 'Согласовано (квартал)', 'Отказано (квартал)', 'На рассмотрении (квартал)', 'Согласовано (год)', 'Отказано (год)', 'На рассмотрении (год)', 'Примечание'],
                // Форма 4: 6 колонок
                4: ['№', 'Вид акта и наименование органа', 'Вид нарушения', 'Принятые меры по устранению', 'Обжалование актов', 'Примечание']
            };
            
            // ВСЕГДА используем стандартные заголовки для текущей формы
            let headers = defaultHeaders[currentTab] || [];
            
            // Если нет стандартных заголовков, создаём по количеству колонок
            if (headers.length === 0 && allRows.length > 0) {
                const maxCols = Math.max(...allRows.map(r => r.cells.length));
                headers = ['№'];
                for (let i = 1; i < maxCols; i++) {
                    headers.push(`Колонка ${i}`);
                }
            }

            let html = '<div class="form-table-container">';
            html += '<table class="form-table">';
            
            // Заголовки (используем все заголовки как есть)
            html += '<thead><tr>';
            headers.forEach((header, index) => {
                if (index === 0) {
                    html += `<th style="width: 50px; text-align: center;">${escapeHtml(header)}</th>`;
                } else {
                    html += `<th>${escapeHtml(header)}</th>`;
                }
            });
            // Добавляем колонку "Файлы"
            html += '<th style="width: 150px;">Файлы</th>';
            html += '</tr></thead>';
            
            // Данные
            html += '<tbody>';
            allRows.forEach((row, index) => {
                html += '<tr>';
                
                // Все ячейки данных (теперь данные содержат ВСЕ колонки, включая первую)
                row.cells.forEach((cell, cellIndex) => {
                    if (cellIndex === 0) {
                        // Первая колонка - используем сквозную нумерацию вместо данных из ячейки
                        html += `<td style="font-weight: 600; background: #f8fafc; text-align: center;">${index + 1}</td>`;
                    } else {
                        html += `<td>${escapeHtml(cell || '')}</td>`;
                    }
                });
                
                // Колонка с файлами (только для этой конкретной секции)
                const allFilesForForm = row.attachedFiles || {};
                const filesForThisSection = allFilesForForm[row.tableId] || [];
                
                if (filesForThisSection.length > 0) {
                    html += '<td>';
                    filesForThisSection.forEach(file => {
                        // НЕ используем escapeHtml для data-атрибутов - кириллица должна остаться как есть
                        // Только экранируем кавычки для безопасности
                        const safeFilename = file.filename.replace(/"/g, '&quot;');
                        const safeOriginal = file.originalName.replace(/"/g, '&quot;');
                        html += `<a href="javascript:void(0)" class="file-link" data-filename="${safeFilename}" data-original="${safeOriginal}" title="${escapeHtml(file.originalName)}">📎 ${escapeHtml(file.originalName)}</a><br>`;
                    });
                    html += '</td>';
                } else {
                    html += '<td style="text-align: center; color: #94a3b8;">—</td>';
                }
                
                html += '</tr>';
            });
            html += '</tbody>';
            
            html += '</table>';
            html += '</div>';
            
            return html;
        }

        // Применение фильтров
        function applyFilters(forms) {
            const userFilter = document.getElementById('userFilter').value;
            const orgFilter = document.getElementById('orgFilter').value;

            if (userFilter) {
                forms = forms.filter(f => f.userId === userFilter);
            }

            if (orgFilter) {
                forms = forms.filter(f => {
                    const org = f.userOrganization || f.organization;
                    return org === orgFilter;
                });
            }

            return forms;
        }

        // Обновление списков фильтров
        function updateFilters() {
            console.log('🔄 Обновление фильтров, всего форм:', allForms.length);
            
            // Пользователи - убираем дубликаты правильно
            const userFilter = document.getElementById('userFilter');
            const usersMap = new Map();
            allForms.forEach(f => {
                if (f.userId && !usersMap.has(f.userId)) {
                    usersMap.set(f.userId, f.userFullName || f.username);
                }
            });
            
            userFilter.innerHTML = '<option value="">Все пользователи</option>';
            usersMap.forEach((name, id) => {
                userFilter.innerHTML += `<option value="${id}">${escapeHtml(name)}</option>`;
            });
            console.log('👤 Пользователей в фильтре:', usersMap.size);

            // Организации - убираем дубликаты
            const orgFilter = document.getElementById('orgFilter');
            const orgsSet = new Set(allForms.map(f => f.userOrganization || f.organization).filter(o => o));
            
            orgFilter.innerHTML = '<option value="">Все организации</option>';
            orgsSet.forEach(org => {
                orgFilter.innerHTML += `<option value="${escapeHtml(org)}">${escapeHtml(org)}</option>`;
            });
            console.log('🏢 Организаций в фильтре:', orgsSet.size);
        }

        // Фильтрация
        function filterForms() {
            renderCurrentForm();
        }

        // Управление пользователями
        function toggleUsersSection() {
            const container = document.getElementById('usersTableContainer');
            const icon = document.getElementById('usersToggleIcon');
            
            usersVisible = !usersVisible;
            
            if (usersVisible) {
                container.style.display = 'block';
                icon.style.transform = 'rotate(0deg)';
                icon.textContent = '▼';
            } else {
                container.style.display = 'none';
                icon.style.transform = 'rotate(-90deg)';
                icon.textContent = '▶';
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('usersTableContainer');
            if (users.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 2rem;">Нет пользователей</p>';
                return;
            }

            let html = '<table class="users-table"><thead><tr>';
            html += '<th>ФИО</th><th>Логин</th><th>Email</th><th>Организация</th><th>Роль</th><th>Действия</th>';
            html += '</tr></thead><tbody>';

            users.forEach(user => {
                html += '<tr>';
                html += `<td><strong>${escapeHtml(user.fullName)}</strong></td>`;
                html += `<td>${escapeHtml(user.username)}</td>`;
                html += `<td>${escapeHtml(user.email)}</td>`;
                html += `<td>${escapeHtml(user.organization || 'Не указано')}</td>`;
                html += `<td><span style="padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; ${user.role === 'admin' ? 'background: #fee; color: #c33;' : 'background: #efe; color: #3c3;'}">
                    ${user.role === 'admin' ? '👑 Админ' : '👤 Пользователь'}
                </span></td>`;
                html += `<td>${user.role !== 'admin' ? `<button class="action-btn btn-delete" onclick="deleteUser('${user.id}', '${escapeHtml(user.fullName)}')">🗑️</button>` : '—'}</td>`;
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function showCreateUserModal() {
            document.getElementById('createUserModal').classList.add('active');
            document.getElementById('newUserUsername').value = '';
            document.getElementById('newUserPassword').value = '';
            document.getElementById('newUserOrganization').value = 'МТСЗН РК';
        }

        function closeCreateUserModal() {
            document.getElementById('createUserModal').classList.remove('active');
        }

        async function handleCreateUser(event) {
            event.preventDefault();
            
            const username = document.getElementById('newUserUsername').value;
            const password = document.getElementById('newUserPassword').value;
            const organization = document.getElementById('newUserOrganization').value;
            
            const btn = document.getElementById('createUserBtn');
            btn.disabled = true;
            btn.textContent = 'Создание...';
            
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email: username,
                        password,
                        fullName: username,
                        organization,
                        role: 'user'
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Ошибка создания');

                showToast('Пользователь создан', 'success');
                closeCreateUserModal();
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Создать';
            }
        }

        async function deleteUser(userId, userName) {
            if (!confirm(`Удалить пользователя "${userName}"?`)) return;

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Ошибка удаления');

                showToast('Пользователь удалён', 'success');
                loadUsers();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Скачивание файла с авторизацией
        async function downloadFile(filename, originalName) {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/files/${filename}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Файл не найден');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = originalName || filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                console.error('❌ Ошибка скачивания:', error);
                showToast('Ошибка скачивания файла', 'error');
            }
        }

        // Закрытие модалки по клику вне её
        document.getElementById('createUserModal').addEventListener('click', (e) => {
            if (e.target.id === 'createUserModal') closeCreateUserModal();
        });

        // Делегирование клика на ссылки файлов
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('file-link') || e.target.closest('.file-link')) {
                const link = e.target.classList.contains('file-link') ? e.target : e.target.closest('.file-link');
                const filename = link.dataset.filename;
                const originalName = link.dataset.original;
                
                if (filename && originalName) {
                    downloadFile(filename, originalName);
                }
            }
        });

        // Скачивание отфильтрованных данных как DOCX
        async function downloadFilteredData() {
            // Получаем текущие отфильтрованные формы
            let forms = allForms.filter(f => f.formNumber == currentTab);
            forms = applyFilters(forms);
            
            if (forms.length === 0) {
                showToast('Нет данных для скачивания', 'error');
                return;
            }

            // Собираем все строки
            let allRows = [];
            forms.forEach(form => {
                const formData = form.formData;
                if (formData.tables && Object.keys(formData.tables).length > 0) {
                    for (const tableId in formData.tables) {
                        const tableData = formData.tables[tableId];
                        const rows = tableData.rows || tableData;
                        rows.forEach(row => {
                            allRows.push({
                                user: form.userFullName || form.username,
                                organization: form.userOrganization || form.organization,
                                cells: row
                            });
                        });
                    }
                }
            });

            if (allRows.length === 0) {
                showToast('Нет данных для скачивания', 'error');
                return;
            }

            // Заголовки для каждой формы
            const defaultHeaders = {
                1: ['№', 'Истец', 'Ответчик', 'Суть спора', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                2: ['№', 'Истец', 'Ответчик', 'Суть спора', 'Судебный акт первой инстанции', 'Апелляция', 'Кассация', 'Примечание'],
                3: ['Предмет спора', 'Кол-во кв/год', 'Согласовано (кв)', 'Отказано (кв)', 'На рассм. (кв)', 'Согласовано (год)', 'Отказано (год)', 'На рассм. (год)', 'Примечание'],
                4: ['№', 'Вид акта', 'Вид нарушения', 'Принятые меры', 'Обжалование', 'Примечание']
            };
            
            const headers = defaultHeaders[currentTab] || [];
            const formNames = {
                1: 'Гражданские_дела',
                2: 'Административные_дела', 
                3: 'Запросы_на_согласование',
                4: 'Акты_судебных_органов'
            };

            try {
                const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType, AlignmentType, BorderStyle } = docx;

                // Создаём строки таблицы
                const tableRows = [];
                
                // Заголовок
                tableRows.push(new TableRow({
                    children: headers.map(header => new TableCell({
                        children: [new Paragraph({
                            children: [new TextRun({ text: header, bold: true, size: 20 })],
                            alignment: AlignmentType.CENTER
                        })],
                        shading: { fill: "1a365d" },
                    })),
                    tableHeader: true
                }));

                // Данные
                allRows.forEach((row, index) => {
                    tableRows.push(new TableRow({
                        children: row.cells.map((cell, cellIndex) => new TableCell({
                            children: [new Paragraph({
                                children: [new TextRun({ 
                                    text: cellIndex === 0 ? String(index + 1) : (cell || ''), 
                                    size: 20 
                                })],
                                alignment: cellIndex === 0 ? AlignmentType.CENTER : AlignmentType.LEFT
                            })]
                        }))
                    }));
                });

                // Создаём документ
                const doc = new Document({
                    sections: [{
                        properties: {
                            page: { 
                                margin: { top: 720, right: 720, bottom: 720, left: 720 },
                                size: { orientation: "landscape" }
                            }
                        },
                        children: [
                            new Paragraph({
                                children: [new TextRun({ text: `Форма № ${currentTab} - Сводный отчет`, bold: true, size: 28 })],
                                alignment: AlignmentType.CENTER,
                                spacing: { after: 200 }
                            }),
                            new Paragraph({
                                children: [new TextRun({ text: `Всего записей: ${allRows.length}`, size: 22 })],
                                spacing: { after: 200 }
                            }),
                            new Table({
                                rows: tableRows,
                                width: { size: 100, type: WidthType.PERCENTAGE }
                            })
                        ]
                    }]
                });

                // Генерируем файл
                const blob = await Packer.toBlob(doc);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const date = new Date().toISOString().slice(0, 10);
                a.download = `Форма_${currentTab}_${formNames[currentTab]}_${date}.docx`;
                document.body.appendChild(a);
                a.click();
                URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showToast(`Скачано ${allRows.length} записей`, 'success');
            } catch (error) {
                console.error('❌ Ошибка генерации DOCX:', error);
                showToast('Ошибка генерации документа', 'error');
            }
        }
    </script>
